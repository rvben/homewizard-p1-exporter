name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: stable
        components: rustfmt, clippy
    
    - name: Run tests
      run: make test
    
    - name: Check code quality
      run: make check

  publish-crate:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: stable
    
    - name: Authenticate to crates.io via Trusted Publishing
      id: crates_io_auth
      # v1.0.5
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

    - name: Publish to crates.io
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    
    - name: Log in to Docker Hub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
      with:
        images: |
          ${{ secrets.DOCKER_USERNAME }}/homewizard-p1-exporter
          ghcr.io/${{ github.repository_owner }}/homewizard-p1-exporter
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
    
    - name: Build and push Docker image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [test, publish-crate, docker]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: stable
    
    - name: Install musl toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools
        # For cross-compilation to aarch64
        sudo apt-get install -y gcc-aarch64-linux-gnu
    
    - name: Build release binaries
      run: |
        # Build for multiple targets
        rustup target add x86_64-unknown-linux-musl
        rustup target add aarch64-unknown-linux-musl
        
        # Set up cross-compilation environment
        export CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
        
        cargo build --release --target x86_64-unknown-linux-musl
        cargo build --release --target aarch64-unknown-linux-musl
        
        # Create archives
        mkdir -p dist
        tar -czf dist/homewizard-p1-exporter-x86_64-linux.tar.gz -C target/x86_64-unknown-linux-musl/release homewizard-p1-exporter
        tar -czf dist/homewizard-p1-exporter-aarch64-linux.tar.gz -C target/aarch64-unknown-linux-musl/release homewizard-p1-exporter
    
    - name: Extract changelog content
      id: changelog
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        # Extract the changelog section for this version
        awk -v ver="[$VERSION]" '
          $0 ~ "## \\[" ver "\\]" { found=1; next }
          found && /^## \[/ { exit }
          found && !/^$/ { print }
        ' CHANGELOG.md > release_notes.md
        
        # If no specific version found, use unreleased section
        if [ ! -s release_notes.md ]; then
          awk '
            /^## \[Unreleased\]/ { found=1; next }
            found && /^## \[/ { exit }
            found && !/^$/ { print }
          ' CHANGELOG.md > release_notes.md
        fi
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        files: dist/*
        body_path: release_notes.md
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
