name: dependencies

on:
  schedule:
    - cron: "51 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@71c7410370982ac94098d2e12f86724c055aef5d # v0.9.1
    with:
      langs: rust,docker,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      validation-command: make check && make test && make docker-build
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
