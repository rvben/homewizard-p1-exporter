name: Husker smoke

run-name: Husker smoke ${{ inputs.nonce || github.event_name }}

on:
  schedule:
    # Daily lifecycle proof. The one-shot runner must execute this job and the
    # Husker service reconciler must replace it afterward.
    - cron: '17 04 * * *'
  workflow_dispatch:
    inputs:
      nonce:
        description: Unique fleet-smoke correlation value
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, husker, microvm]
    timeout-minutes: 10
    steps:
      - name: Prove the ephemeral runner is usable
        shell: bash
        env:
          CORRELATION: ${{ inputs.nonce || format('scheduled-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test -r /etc/husker-runner-image
          # shellcheck disable=SC1091
          source /etc/husker-runner-image
          actual_rust="$(rustc --version | awk '{print $2}')"
          actual_runner="$(/opt/actions-runner/bin/Runner.Listener --version)"
          test "${actual_rust}" = "${RUST_TOOLCHAIN_VERSION}"
          test "${actual_runner}" = "${ACTIONS_RUNNER_VERSION}"
          {
            echo "### Husker runner proof"
            echo
            echo "- Runner: \`${RUNNER_NAME}\`"
            echo "- Correlation: \`${CORRELATION}\`"
            echo "- Actions runner: \`${actual_runner}\`"
            echo "- Rust: \`$(rustc --version)\`"
          } >> "${GITHUB_STEP_SUMMARY}"
